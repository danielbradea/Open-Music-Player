name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test OMPlayer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK, run unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OMPlayer-debug.apk

      - name: Save APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: OMPlayer-debug-${{ github.run_number }}
          path: dist/OMPlayer-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMPlayer-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add download link to summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '## OMPlayer debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK artifact]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unzip the artifact and install OMPlayer-debug.apk. The artifact is retained for 30 days.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish versioned APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: OMPlayer-debug-${{ github.run_number }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="dist/OMPlayer-${VERSION}.apk"
          mv dist/OMPlayer-debug.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          cat > release-notes.md <<'NOTES'
          ## Instalare
          Descarcă fișierul APK din Assets și deschide-l pe un telefon cu Android 12 sau mai nou.

          Acest APK este un build debug, semnat automat de mediul GitHub Actions. La instalarea peste un APK semnat cu altă cheie, Android poate cere dezinstalarea versiunii vechi; dezinstalarea elimină setările și playlisturile locale ale aplicației.

          ## Noutăți
          - Selectarea melodiilor din playlisturi YouTube înainte de descărcare, cu numele original sau un nume personalizat pentru playlistul local.
          - Progres pentru întregul playlist și pentru fiecare melodie: descărcată, în curs, în așteptare, eșuată sau anulată.
          - Salvarea playlisturilor în folder și restaurarea după reinstalare.
          - Restaurarea piesei, poziției, playlistului, shuffle și repetării la redeschidere.
          - Tranziție animată între playerul compact și cel complet.
          - Remedierea reluării vechilor linkuri de descărcare la redeschidere.
          - Iconițe PNG transparente pentru toate densitățile Android.

          Pentru salvarea playlisturilor în afara aplicației, alege un folder din Setări → Alege folderul / Restaurează. După reinstalare selectează același folder și păstrează fișierele audio.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "${APK}.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "${APK}.sha256" --verify-tag --title "OMPlayer ${VERSION}" --notes-file release-notes.md
          fi
          echo "## [OMPlayer ${VERSION} Release](https://github.com/${GH_REPO}/releases/tag/${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"