name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test OMPlayer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK, run unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OMPlayer-debug.apk

      - name: Save APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: OMPlayer-debug-${{ github.run_number }}
          path: dist/OMPlayer-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMPlayer-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add download link to summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '## OMPlayer debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK artifact]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unzip the artifact and install OMPlayer-debug.apk. The artifact is retained for 30 days.' >> "$GITHUB_STEP_SUMMARY"
